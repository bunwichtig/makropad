name: .exe bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyInstaller mit selbst übersetztem Startprogramm: Der vorgefertigte Bootloader
          # wird von Virenscannern oft fälschlich als Schadsoftware erkannt.
          git clone --depth 1 --branch v6.16.0 https://github.com/pyinstaller/pyinstaller.git C:\pyinstaller-src
          Push-Location C:\pyinstaller-src\bootloader
          python ./waf all --target-arch=64bit
          Pop-Location
          pip install C:\pyinstaller-src

      - name: .exe bauen
        run: >
          pyinstaller start.py
          --name makropad
          --onedir
          --noconsole
          --paths src
          --add-data "config.json;."
          --hidden-import pystray._win32
          --collect-submodules pycaw
          --collect-submodules comtypes

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          Copy-Item config.json dist\makropad\
          Compress-Archive -Path dist\makropad -DestinationPath makropad-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: makropad-windows
          path: dist/makropad/

      - name: Download-Seite aktualisieren (Release "neueste")
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste
          name: Neueste Version (automatisch gebaut)
          prerelease: true
          make_latest: false
          files: makropad-windows.zip
          body: |
            Automatisch gebaut aus dem aktuellen Stand von `main`.
            **makropad-windows.zip** herunterladen, entpacken und im Ordner `makropad` die **makropad.exe** starten.

      - name: Release für Version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: makropad-windows.zip
